<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PSS Nexus Chat</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #3f0e40;
        color: white;
        font-family: Segoe UI, sans-serif;
      }
      button {
        margin-top: 16px;
        border: 0;
        border-radius: 6px;
        padding: 8px 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Can't reach PSS Nexus Chat</h1>
      <p id="status">Retrying…</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const seconds = Math.round(Number(params.get("retryMs") || 5000) / 1000);
      document.getElementById("status").textContent =
        "Retrying in " + seconds + "s";
    </script>
  </body>
</html>
